<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D lab — ORIEL (dev only)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0908; color: #ede6da; font: 12px/1.4 'DM Mono', monospace; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
      .panel { position: fixed; left: 12px; top: 12px; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px; }
      .panel[hidden] { display: none; }
      .panel button { background: #1a1815; color: inherit; border: 1px solid #333; padding: 4px 8px; cursor: pointer; font: inherit; }
      .panel button[aria-pressed='true'] { border-color: #cdb07a; color: #cdb07a; }
      .panel label { display: flex; gap: 6px; align-items: center; width: 100%; }
      .panel input[type='range'] { flex: 1; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="panel" data-panel></div>
    <script type="module" src="./lab.js"></script>
  </body>
</html>
